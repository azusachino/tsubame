[package]
name = "tsubame_commons"
version = "0.0.1"
authors = ["azusachino <azusa146@gmail.com>"]
edition = "2021"

[lib]
name = "tsubame_commons"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
toml = "0.9"

serde = "1"
serde_derive = "1"
serde_json = "1"

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

tonic = "0.14"
prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
